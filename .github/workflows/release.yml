name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history: the changeset generator walks commits back to the
          # last release commit.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable npm trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: pnpm test && pnpm typecheck

      # Derives changesets from the conventional commits landed since the last
      # release commit. Hand-written changesets in `.changeset/` are kept as-is;
      # `changeset version` consumes both and deletes them, so nothing generated
      # here is committed back to `main`.
      - name: Generate changesets from commits
        run: pnpm changeset:auto

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          createGithubReleases: true
          title: "chore: release package"
          commit: "chore: release package"
        env:
          # Only needed to bootstrap the first package version. Once npm trusted
          # publishing is configured, OIDC is preferred and this secret can go.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
